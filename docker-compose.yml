version: "3.8"

services:
  # Redis service for message queue
  redis:
    image: redis:7-alpine
    container_name: task_queue_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - task_queue_network

  # FastAPI server
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: task_queue_api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_PATH=/app/data/tasks.db
      - WORKER_ENABLED=False
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    command: python main.py
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - task_queue_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Worker service (can scale with docker-compose up --scale worker=N)
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: task_queue_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_PATH=/app/data/tasks.db
      - WORKER_NUM=1
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    command: python worker_main.py
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - task_queue_network

volumes:
  redis_data:

networks:
  task_queue_network:
    driver: bridge
